<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Signature</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg:        #0A0A0A;
            --card:      #141414;
            --border:    #252525;
            --canvas-bg: #1C1C1C;
            --line:      #404040;
            --dim:       #666;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg);
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            font-family: -apple-system, system-ui, sans-serif;
            height: 100vh; color: #fff;
            overflow: hidden; position: fixed; width: 100%;
        }

        .container {
            width: 92%; max-width: 420px;
            background: var(--card);
            margin-top: 32px;
            padding: 24px 20px 20px;
            border-radius: 24px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.7);
            border: 1px solid var(--border);
            user-select: none;
        }

        .title { font-size: 16px; font-weight: 600; margin: 0 0 4px; text-align: center; }
        .hint  { color: var(--dim); font-size: 12px; margin: 0 0 16px; text-align: center; }

        /* aspect-ratio 8:3 = 914400 EMU / 342900 EMU (exact contract size) */
        #canvas-container {
            width: 100%; aspect-ratio: 8 / 3;
            background: var(--canvas-bg);
            border: 1px solid var(--border);
            border-radius: 10px 10px 0 0;
            border-bottom: none;
            touch-action: none; overflow: hidden;
        }

        canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }

        /* Baseline — bottom edge of the signature image in the contract */
        .sig-line { width: 100%; height: 1px; background: var(--line); }

        .clear-btn {
            margin-top: 14px; width: 100%; padding: 11px;
            background: transparent; color: var(--dim);
            border: 1px solid var(--border); border-radius: 10px;
            font-size: 11px; font-weight: 600;
            letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <p class="title">Подпись</p>
    <p class="hint">Нарисуйте подпись выше черты</p>
    <div id="canvas-container">
        <canvas id="signature-pad"></canvas>
    </div>
    <div class="sig-line"></div>
    <button class="clear-btn" onclick="clearPad()">Очистить</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();

    tg.MainButton.text = "ОТПРАВИТЬ ПОДПИСЬ";
    tg.MainButton.setParams({ color: '#FFFFFF', text_color: '#000000' });

    const canvas = document.getElementById('signature-pad');
    const ctx    = canvas.getContext('2d');

    let isDrawing = false;
    let hasContent = false;
    let segments  = [];   // completed polylines: [{x,y}, ...][]
    let curSeg    = null; // polyline being drawn right now

    // ── Canvas init — preserves drawing on resize ────────────────────────────
    function setupCtx() {
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth   = 2.5;
        ctx.lineCap     = 'round';
        ctx.lineJoin    = 'round';
    }

    function initCanvas() {
        const dpr  = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width  = Math.round(rect.width  * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.scale(dpr, dpr);
        setupCtx();
        redraw();
    }

    // Replay all stored segments — called after every resize
    function redraw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const seg of segments) {
            if (seg.length < 2) continue;
            ctx.beginPath();
            ctx.moveTo(seg[0].x, seg[0].y);
            for (let i = 1; i < seg.length; i++) ctx.lineTo(seg[i].x, seg[i].y);
            ctx.stroke();
        }
    }

    // Debounce resize: only reinit after the viewport settles (avoids flicker on keyboard open)
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(initCanvas, 200);
    });

    initCanvas();

    // ── Input helpers ────────────────────────────────────────────────────────
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const src  = e.touches ? e.touches[0] : e;
        return { x: src.clientX - rect.left, y: src.clientY - rect.top };
    }

    // ── Drawing handlers ─────────────────────────────────────────────────────
    function startDrawing(e) {
        if (e.cancelable) e.preventDefault();
        isDrawing  = true;
        hasContent = true;
        tg.MainButton.show();
        const p = getPos(e);
        curSeg = [p];
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
    }

    function draw(e) {
        if (!isDrawing) return;
        if (e.cancelable) e.preventDefault();
        const p = getPos(e);
        curSeg.push(p);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
    }

    function stopDrawing() {
        if (!isDrawing) return;
        isDrawing = false;
        if (curSeg && curSeg.length > 0) {
            segments.push(curSeg);
            curSeg = null;
        }
    }

    canvas.addEventListener('mousedown',  startDrawing);
    canvas.addEventListener('mousemove',  draw);
    window.addEventListener('mouseup',    stopDrawing);
    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove',  draw,         { passive: false });
    canvas.addEventListener('touchend',   stopDrawing,  { passive: false });

    // ── Clear ────────────────────────────────────────────────────────────────
    function clearPad() {
        segments = []; curSeg = null; hasContent = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        tg.MainButton.hide();
    }

    // ── Send ─────────────────────────────────────────────────────────────────
    tg.onEvent('mainButtonClicked', function () {
        if (!hasContent) return;

        // Serialize to the format the Python parser expects:
        // "S|x,y|x,y|S|x,y|x,y"  (S marks segment start)
        const parts = [];
        for (const seg of segments) {
            parts.push('S');
            for (const p of seg) parts.push(`${Math.round(p.x)},${Math.round(p.y)}`);
        }
        const data = parts.join('|');

        if (data.length > 4096) {
            alert('Подпись слишком сложная — попробуйте упростить');
            return;
        }

        tg.sendData(data);
        setTimeout(() => tg.close(), 150);
    });
</script>

</body>
</html>
