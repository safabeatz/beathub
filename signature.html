<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Signature</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg:          #0A0A0A;
            --card:        #141414;
            --border:      #252525;
            --canvas-bg:   #1C1C1C;
            --line-color:  #404040;
            --btn-color:   #333;
            --text-dim:    #666;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg);
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            font-family: -apple-system, system-ui, sans-serif;
            height: 100vh; color: #fff;
            overflow: hidden;
            position: fixed; width: 100%;
        }

        .container {
            width: 92%; max-width: 420px;
            background: var(--card);
            margin-top: 32px;
            padding: 24px 20px 20px;
            border-radius: 24px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.7);
            border: 1px solid var(--border);
            user-select: none;
        }

        .title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.02em;
            margin: 0 0 4px 0;
            text-align: center;
        }

        .hint {
            color: var(--text-dim);
            font-size: 12px;
            text-align: center;
            margin: 0 0 16px 0;
        }

        /* ─── Canvas: aspect-ratio exactly 8:3 matches Word insertion ─── */
        #canvas-wrap {
            position: relative;
            width: 100%;
        }

        #canvas-container {
            width: 100%;
            /* 914400 EMU / 342900 EMU = 8:3 exactly */
            aspect-ratio: 8 / 3;
            background: var(--canvas-bg);
            border: 1px solid var(--border);
            border-radius: 10px 10px 0 0;
            border-bottom: none;
            touch-action: none;
            overflow: hidden;
        }

        canvas {
            width: 100%; height: 100%;
            display: block; cursor: crosshair;
        }

        /* ─── Signature baseline — bottom of image sits here ─── */
        .sig-line {
            width: 100%;
            height: 1px;
            background: var(--line-color);
            /* flush with canvas bottom, no gap */
        }

        .clear-btn {
            margin-top: 14px;
            width: 100%; padding: 11px;
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <p class="title">Подпись</p>
    <p class="hint">Нарисуйте подпись выше черты</p>

    <div id="canvas-wrap">
        <div id="canvas-container">
            <canvas id="signature-pad"></canvas>
        </div>
        <!-- Baseline: bottom edge of the inserted image in the contract -->
        <div class="sig-line"></div>
    </div>

    <button class="clear-btn" onclick="clearPad()">Очистить</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();

    tg.MainButton.text = "ОТПРАВИТЬ ПОДПИСЬ";
    tg.MainButton.setParams({ color: '#FFFFFF', text_color: '#000000' });

    const canvas = document.getElementById('signature-pad');
    const ctx    = canvas.getContext('2d');
    let isDrawing = false, hasContent = false, points = [];

    function initCanvas() {
        const dpr  = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width  = rect.width  * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth   = 2.5;
        ctx.lineCap     = 'round';
        ctx.lineJoin    = 'round';
    }

    window.addEventListener('resize', () => { clearPad(); initCanvas(); });
    initCanvas();

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const src  = e.touches ? e.touches[0] : e;
        return { x: src.clientX - rect.left, y: src.clientY - rect.top };
    }

    function startDrawing(e) {
        if (e.cancelable) e.preventDefault();
        isDrawing = true; hasContent = true;
        tg.MainButton.show();
        const p = getPos(e);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        points.push('S', [Math.round(p.x), Math.round(p.y)]);
    }

    function draw(e) {
        if (!isDrawing) return;
        if (e.cancelable) e.preventDefault();
        const p = getPos(e);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
        points.push([Math.round(p.x), Math.round(p.y)]);
    }

    function stopDrawing() { isDrawing = false; }

    canvas.addEventListener('mousedown',  startDrawing);
    canvas.addEventListener('mousemove',  draw);
    window.addEventListener('mouseup',    stopDrawing);
    canvas.addEventListener('touchstart', startDrawing, { passive: false });
    canvas.addEventListener('touchmove',  draw,         { passive: false });
    canvas.addEventListener('touchend',   stopDrawing,  { passive: false });

    function clearPad() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        hasContent = false;
        points = [];
        tg.MainButton.hide();
    }

    tg.onEvent('mainButtonClicked', function () {
        if (!hasContent) return;
        const data = points.map(p => Array.isArray(p) ? p.join(',') : p).join('|');
        if (data.length > 4096) {
            alert('Подпись слишком сложная — попробуйте проще');
            return;
        }
        tg.sendData(data);
        setTimeout(() => tg.close(), 150);
    });
</script>

</body>
</html>
